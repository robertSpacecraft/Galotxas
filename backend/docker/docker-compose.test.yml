name: galotxas-test

services:
  test-db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: galotxas_testing
      MARIADB_USER: galotxas_test
      MARIADB_PASSWORD: galotxas_test
      MARIADB_ROOT_PASSWORD: root_test
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - test

  test:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    working_dir: /var/www
    volumes:
      - ..:/var/www
    environment:
      APP_ENV: testing
      DB_CONNECTION: mariadb
      DB_HOST: test-db
      DB_PORT: 3306
      DB_DATABASE: galotxas_testing
      DB_USERNAME: galotxas_test
      DB_PASSWORD: galotxas_test
    depends_on:
      test-db:
        condition: service_healthy
    command: php artisan test
    networks:
      - test

networks:
  test:
    driver: bridge
