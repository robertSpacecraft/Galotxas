name: galotxas

services:
  app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ..:/var/www
    depends_on:
      - db
    networks:
      - galotxas_net

  web:
    image: nginx:1.27-alpine
    command:
      - /bin/sh
      - -c
      - |
        media_group="$$(awk -F: '$$3 == 1000 { print $$1; exit }' /etc/group)"
        if [ -z "$$media_group" ]; then
          addgroup -g 1000 media-readers
          media_group="media-readers"
        fi
        addgroup nginx "$$media_group" 2>/dev/null || true
        exec nginx -g 'daemon off;'
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www
      - ./app/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - galotxas_net

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: galotxas
      MARIADB_USER: galotxas
      MARIADB_PASSWORD: galotxas
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - galotxas_db_data:/var/lib/mysql
    networks:
      - galotxas_net

volumes:
  galotxas_db_data:

networks:
  galotxas_net:
    driver: bridge
